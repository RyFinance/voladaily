<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Voladaily: which way every market session leans, and how far it moves">
  <defs>
    <radialGradient id="g1" cx="12%" cy="0%" r="70%"><stop offset="0" stop-color="#2A2140"/><stop offset="1" stop-color="#111014" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="100%" cy="90%" r="60%"><stop offset="0" stop-color="#1F1A2E"/><stop offset="1" stop-color="#111014" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1A21"/><stop offset="1" stop-color="#16151B"/></linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#fff" opacity=".025"/><rect x="2" y="3" width="1" height="1" fill="#fff" opacity=".02"/></pattern>
    <symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 2 4 14h6.5L9 22l11-13h-6.8L13.5 2z" fill="#8F7BF2"/></symbol>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif}
      .m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
      .ink{fill:#ECE9F1}.ink2{fill:#B7B2C0}.mut{fill:#857F8F}.up{fill:#6CC398}.dn{fill:#E5786F}.vi{fill:#8F7BF2}
      .bar{transform-box:fill-box;transform-origin:center;animation:breathe 4.8s ease-in-out infinite}
      .bar.b2{animation-delay:-.9s}.bar.b3{animation-delay:-1.8s}.bar.b4{animation-delay:-2.7s}.bar.b5{animation-delay:-3.6s}
      @keyframes breathe{0%,100%{transform:scaleX(.82)}50%{transform:scaleX(1)}}
      .sel{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.35}}
      @media (prefers-reduced-motion:reduce){.bar,.sel{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="460" fill="#111014"/>
  <rect width="1280" height="460" fill="url(#g1)"/>
  <rect width="1280" height="460" fill="url(#g2)"/>
  <rect width="1280" height="460" fill="url(#grain)"/>

  <!-- left: wordmark -->
  <text x="72" y="92" class="m mut" font-size="13">FORECAST · EVERY SESSION AHEAD</text>
  <text x="68" y="206" class="s ink" font-size="104" letter-spacing="-5"><tspan font-weight="300">Vola</tspan><tspan font-weight="600">DAILY</tspan></text>
  <line x1="72" y1="252" x2="600" y2="252" stroke="#5A5363"/>
  <text x="72" y="294" class="s ink" font-size="25" letter-spacing="-.5">Which way each session leans,</text>
  <text x="72" y="327" class="s ink2" font-size="25" letter-spacing="-.5">and how far it is likely to move.</text>
  <text x="72" y="372" class="m mut" font-size="12">WALK-FORWARD TESTED SINCE 2010</text>
  <text x="72" y="392" class="m mut" font-size="12" opacity=".75">VIX CURVE · ECONOMIC CALENDAR · SEC EARNINGS</text>

  <!-- tickers as pager circles -->
  <g class="m" font-size="11" text-anchor="middle">
    <circle cx="90" cy="424" r="18" fill="#ECE9F1"/><text x="90" y="428" fill="#111014">SPY</text>
    <circle cx="134" cy="424" r="18" fill="none" stroke="#45404D"/><text x="134" y="428" class="ink2">QQQ</text>
    <circle cx="178" cy="424" r="18" fill="none" stroke="#45404D"/><text x="178" y="428" class="ink2">IWM</text>
    <circle cx="222" cy="424" r="18" fill="none" stroke="#45404D"/><text x="222" y="428" class="ink2">GLD</text>
    <circle cx="266" cy="424" r="18" fill="none" stroke="#45404D"/><text x="266" y="428" class="ink2">TLT</text>
  </g>

  <!-- right: a week of the calendar -->
  <g transform="translate(676 58)">
    <rect width="540" height="344" rx="20" fill="url(#card)" stroke="#26232B"/>
    <text x="28" y="40" class="m mut" font-size="11">MORNING BRIEF · MON, NOV 2</text>
    <text x="28" y="74" class="s ink" font-size="21" letter-spacing="-.4">A normal-sized Monday, leaning up <tspan class="up">+0.11%</tspan></text>
    <line x1="28" y1="96" x2="512" y2="96" stroke="#5A5363"/>

    <g class="m mut" font-size="10.5">
      <text x="28" y="122">MON</text><text x="124" y="122">TUE</text><text x="220" y="122">WED</text><text x="316" y="122">THU</text><text x="412" y="122">FRI</text>
    </g>

    <!-- day cells -->
    <g class="s">
      <rect x="22" y="134" width="88" height="112" rx="10" fill="#1F1D25" stroke="#8F7BF2" class="sel"/>
      <text x="34" y="160" class="ink" font-size="15" font-weight="500">2 <tspan class="mut" font-weight="400">Nov</tspan></text>
      <text x="34" y="192" class="up" font-size="22" font-weight="500" letter-spacing="-.6">+0.11%</text>
      <text x="34" y="214" class="m mut" font-size="9.5">55% UP</text>
      <rect x="34" y="228" width="58" height="4" rx="2" fill="#8F7BF2" opacity=".8" class="bar"/>

      <text x="130" y="160" class="ink" font-size="15" font-weight="500">3 <tspan class="mut" font-weight="400">Nov</tspan></text>
      <text x="130" y="192" class="up" font-size="22" font-weight="500" letter-spacing="-.6">+0.39%</text>
      <text x="130" y="214" class="m mut" font-size="9.5">60% UP</text>
      <rect x="130" y="228" width="50" height="4" rx="2" fill="#8F7BF2" opacity=".55" class="bar b2"/>

      <text x="226" y="160" class="ink" font-size="15" font-weight="500">4 <tspan class="mut" font-weight="400">Nov</tspan></text>
      <use href="#bolt" x="270" y="148" width="14" height="14"/>
      <text x="226" y="192" class="up" font-size="22" font-weight="500" letter-spacing="-.6">+0.09%</text>
      <text x="226" y="214" class="m mut" font-size="9.5">53% UP</text>
      <rect x="226" y="228" width="72" height="4" rx="2" fill="#8F7BF2" opacity=".9" class="bar b3"/>

      <text x="322" y="160" class="ink" font-size="15" font-weight="500">5 <tspan class="mut" font-weight="400">Nov</tspan></text>
      <text x="322" y="192" class="dn" font-size="22" font-weight="500" letter-spacing="-.6">−0.02%</text>
      <text x="322" y="214" class="m mut" font-size="9.5">50% UP</text>
      <rect x="322" y="228" width="60" height="4" rx="2" fill="#8F7BF2" opacity=".6" class="bar b4"/>

      <text x="418" y="160" class="ink" font-size="15" font-weight="500">6 <tspan class="mut" font-weight="400">Nov</tspan></text>
      <use href="#bolt" x="462" y="148" width="14" height="14"/>
      <text x="418" y="192" class="up" font-size="22" font-weight="500" letter-spacing="-.6">+0.14%</text>
      <text x="418" y="214" class="m mut" font-size="9.5">55% UP</text>
      <rect x="418" y="228" width="68" height="4" rx="2" fill="#8F7BF2" opacity=".85" class="bar b5"/>
    </g>

    <line x1="28" y1="266" x2="512" y2="266" stroke="#26232B"/>
    <text x="28" y="300" class="m mut" font-size="10.5">THIS WEEK</text>
    <text x="28" y="326" class="s up" font-size="22" font-weight="500" letter-spacing="-.5">+0.72%</text>
    <text x="146" y="300" class="m mut" font-size="10.5">TYPICAL MOVE</text>
    <text x="146" y="326" class="s ink" font-size="22" font-weight="500" letter-spacing="-.5">±0.81%</text>
    <rect x="300" y="298" width="212" height="34" rx="17" fill="#8F7BF2"/>
    <text x="406" y="320" text-anchor="middle" class="m" font-size="12" fill="#111014">✦ 21 SESSIONS +1.59%</text>
  </g>
</svg>
